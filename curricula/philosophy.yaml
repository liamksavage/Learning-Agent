  # ───────────────────────────────────────────────────────────────────────────
  - id: phase-2
    title: Specialization
    summary: >
      Two tracks run in alternation, six to eight weeks on one, then switch. Each opens with a
      textbook on-ramp, then the canonical papers. The Track B sampler runs early, in Phase 1
      after Rousseau; its "then choose" essay waits until Phase 2 proper.
    units:
      - {id: p2-a-onramp, status: undrafted, track: metaphysics, title: "Metaphysics on-ramp (6 wks)", primary: "E. J. Lowe, A Survey of Metaphysics (all); Loux & Crisp, Metaphysics: A Contemporary Introduction", guide: "SEP: Metaphysics, Properties, Identity Over Time", writing: "A map of the problems: universals, particulars, modality, time, causation, persistence, composition", lessons: []}
      - {id: p2-a-universals, status: undrafted, track: metaphysics, title: "Universals and properties (4 wks)", primary: "D. M. Armstrong, Universals: An Opinionated Introduction; David Lewis, New Work for a Theory of Universals", guide: "SEP: Nominalism in Metaphysics, Tropes", writing: "Reconstruct Armstrong's case against class nominalism", lessons: []}
      - {id: p2-a-modality, status: undrafted, track: metaphysics, title: "Modality (6 wks)", primary: "Kripke, Naming and Necessity (all); Lewis, On the Plurality of Worlds chs. 1–2; Plantinga, The Nature of Necessity ch. 4", guide: "Kripke lectures on YouTube; SEP: Possible Worlds", writing: "Essay: Is Lewis's modal realism really the price of taking modality seriously?", lessons: []}
      - {id: p2-a-time, status: undrafted, track: metaphysics, title: "Time and persistence (5 wks)", primary: "McTaggart, The Unreality of Time; Sider, Four-Dimensionalism chs. 1–4; Lewis, Survival and Identity; Parfit, Reasons and Persons Part III", guide: "SEP: Time, Temporal Parts, Personal Identity", writing: "Reconstruct McTaggart's paradox; endurance vs perdurance in your own case", lessons: []}
      - {id: p2-a-composition, status: undrafted, track: metaphysics, title: "Composition and fundamentality (5 wks)", primary: "van Inwagen, Material Beings chs. 1–9 (selections); Schaffer, On What Grounds What; Fine, The Question of Realism", guide: "SEP: Material Constitution, Metaphysical Grounding", writing: "Essay: Does the special composition question have an answer?", lessons: []}
      - {id: p2-a-meta, status: undrafted, track: metaphysics, title: "Metametaphysics (4 wks)", primary: "Carnap, Empiricism, Semantics, and Ontology; Quine, On What There Is (reread); Chalmers, Manley & Wasserman (eds.), Metametaphysics: Introduction + two chapters", guide: "SEP: Metaontology", writing: "Essay: Is metaphysics possible after Carnap? Tie it back to Kant", lessons: []}
      - {id: p2-b-normative, status: undrafted, track: social-theory, title: "Sampler: normative (3 wks)", primary: "Rawls, A Theory of Justice §§ 1–4, 11–17, 24–26; Nozick, Anarchy, State, and Utopia ch. 7", lecture: "Michael Sandel's Harvard Justice course, lectures 1–8", question: "What would a just society look like, and why?", lessons: []}
      - {id: p2-b-critical, status: undrafted, track: social-theory, title: "Sampler: critical / genealogical (3 wks)", primary: "Adorno & Horkheimer, Dialectic of Enlightenment (The Culture Industry); Foucault, Discipline and Punish Part III ch. 3 (Panopticism); Marx reread", lecture: "Rick Roderick, The Self Under Siege", question: "How does power work when nobody is holding a gun?", lessons: []}
      - {id: p2-b-sociological, status: undrafted, track: social-theory, title: "Sampler: sociological (4 wks)", primary: "Weber, The Protestant Ethic (all) and Politics as a Vocation; Durkheim, Suicide Book II ch. 5 and Rules of Sociological Method ch. 1; Bourdieu, Distinction Introduction", guide: "Anthony Giddens, Capitalism and Modern Social Theory", question: "What actually holds a society together, and how would we know?", lessons: []}
      - {id: p2-b-choose, status: undrafted, track: social-theory, title: "Then choose", writing: "1,500-word essay on which strand asks the question you most want answered and why. Directions: Normative (Rawls in full, Habermas, Cohen, Anderson, Mills); Critical (Lukács, Gramsci, Benjamin, Foucault, Butler, Fraser & Honneth); Sociological (Weber, Durkheim, Bourdieu, Giddens, Luhmann).", lessons: []}
      - {id: p2-b-zizek, status: undrafted, track: social-theory, title: "Žižek sequence (6 wks)", primary: "Althusser, Ideology and Ideological State Apparatuses; Bruce Fink, The Lacanian Subject chs. 1–5; Žižek, How to Read Lacan; Žižek, The Sublime Object of Ideology chs. 1 and 3", lecture: "Why Theory podcast (Lacan and Žižek episodes); The Pervert's Guide to Ideology", writing: "Reconstruct Žižek's claim that ideology is not false belief but what we do despite knowing better; test it against Marx's commodity fetishism", lessons: []}
