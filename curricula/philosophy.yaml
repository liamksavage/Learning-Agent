# Self-Taught Philosophy — curriculum data.
# Converted from the Claude Doc "Self-Taught Philosophy Curriculum" on 2026-11-27.
# Lessons are an ordered sequence, not dated. `original_date` records the date the
# doc first planned a lesson for; the agent ignores it when choosing what to serve.
#
# Lesson kinds: read | listen | exercise | write | seminar
# Source kinds: free-online | book (to buy or borrow) | paid-online | audio | video
# Statuses live in state/progress.yaml, never here.

topic: philosophy
title: Self-Taught Philosophy
timezone: America/New_York
hour:
  reenter_min: 10
  work_min: 40
  write_min: 10
week:
  work_days: [mon, tue, wed, thu]
  write_day: fri
  seminar_day: sun
  rest_day: sat
page:
  primer: false            # stage 2 toggle: one-paragraph framing + 5-term glossary per lesson

writing_standard: >
  Each unit ends with a 400–600 word argument reconstruction: the thesis in one sentence;
  the premises numbered; the inference steps; the strongest objection you can find; whether
  the objection lands. Every eight to ten units, one 1,500-word essay comparing two thinkers
  on a shared problem.

phases:
  # ───────────────────────────────────────────────────────────────────────────
  - id: phase-0
    title: Orientation
    summary: >
      Six weeks to sharpen the tools before the long read: argument analysis, enough logic to
      follow a proof, and a map of the whole terrain. Exit test: take a paragraph from Hume,
      number its premises, state its conclusion, and say whether the form is valid.
    units:
      # ── Week 1 ────────────────────────────────────────────────────────────
      - id: p0-w1
        title: "Week 1: learning to read an argument"
        goal: >
          By the write day you can take a passage and write out what it claims, what supports
          the claim, and where the inference happens. The Cave is the practice text because you
          know its shape already; the job is to see it as an argument, not an image.
        have_ready:
          - {kind: free-online, title: "Pryor, Guidelines on Reading Philosophy", url: "http://www.jimpryor.net/teaching/guidelines/reading.html"}
          - {kind: free-online, title: "Pryor, Guidelines on Writing a Philosophy Paper", url: "http://www.jimpryor.net/teaching/guidelines/writing.html"}
          - {kind: free-online, title: "Pryor, Philosophical Terms and Methods (glossary)", url: "http://www.jimpryor.net/teaching/vocab/index.html"}
          - {kind: book, title: "Anthony Weston, A Rulebook for Arguments (any edition; chapter titles given, numbering shifts)", note: "Cheap paperback, ~$10 used. Not legitimately free online. Until you have it, the Van Cleave chapters on each Weston day are the stand-in."}
          - {kind: book, title: "Plato, Republic, Grube/Reeve (Hackett)", note: "Optional. The free Jowett links cover everything Phase 0 needs."}
          - {kind: free-online, title: "Plato, Republic, Jowett translation (Project Gutenberg)", url: "https://www.gutenberg.org/ebooks/1497"}
        audio:
          - {title: "Philosophize This! episodes 1–5 (the pre-Socratics through Socrates)", url: "https://www.philosophizethis.org/podcasts", note: "Light; sets up Unit 1 without effort."}
        lessons:
          - id: p0-w1-l1
            kind: read
            original_date: 2026-11-08
            title: "Pryor, Guidelines on Reading Philosophy"
            task: >
              Read all of Pryor's Guidelines on Reading Philosophy (~20 min). Then read the
              "Vocabulary Describing Arguments" page of his glossary and bookmark the glossary;
              you'll use it for two years.
            note_prompt: "In your own words: the difference between a valid argument and a sound one."
            sources:
              - {kind: free-online, title: "Guidelines on Reading Philosophy", url: "http://www.jimpryor.net/teaching/guidelines/reading.html", extract: all}
              - {kind: free-online, title: "Philosophical Terms and Methods — Vocabulary Describing Arguments", url: "http://www.jimpryor.net/teaching/vocab/index.html", extract: {section: "Vocabulary Describing Arguments"}}
          - id: p0-w1-l2
            kind: read
            original_date: 2026-11-09
            title: "Weston, Introduction and Short Arguments"
            task: >
              Weston, Introduction and "Short Arguments" (premises and conclusions, reliable
              premises, concrete language). Then find one argument in anything you read today
              (news, a work email, a tweet) and write it as numbered premises and a conclusion.
            note_prompt: "Was anything left unstated?"
            sources:
              - {kind: book, title: "Weston, A Rulebook for Arguments", locator: "Introduction; chapter 'Short Arguments'"}
              - {kind: free-online, title: "Van Cleave, Introduction to Logic and Critical Thinking (open textbook)", url: "https://open.umn.edu/opentextbooks/textbooks/457", extract: {chapter: "1"}, verified: false, note: "Stand-in if you don't have Weston: ch. 1 (reconstructing and analyzing arguments). Link unverified until the stage 2 availability check runs."}
          - id: p0-w1-l3
            kind: read
            original_date: 2026-11-10
            title: "Weston, Generalizations and Arguments by Analogy"
            task: "Weston, \"Generalizations\" and \"Arguments by Analogy.\""
            note_prompt: "Write one bad generalization you've believed and say which rule it breaks."
            sources:
              - {kind: book, title: "Weston, A Rulebook for Arguments", locator: "chapters 'Generalizations' and 'Arguments by Analogy'"}
              - {kind: free-online, title: "Van Cleave, Introduction to Logic and Critical Thinking (open textbook)", url: "https://open.umn.edu/opentextbooks/textbooks/457", extract: {chapter: "3"}, verified: false, note: "Stand-in if you don't have Weston: ch. 3 (inductive arguments: generalizations and analogies). Link unverified until the stage 2 availability check runs."}
          - id: p0-w1-l4
            kind: read
            original_date: 2026-11-11
            title: "Plato, Republic 514a–517a: the Cave"
            task: >
              Read the Cave itself (about four pages) twice, slowly. On the second pass mark
              every "so," "therefore," "because" and "must."
            note_prompt: "List every candidate for what the Cave is an argument FOR. There are at least three."
            sources:
              - {kind: free-online, title: "Republic Book 7, modernized Jowett with Stephanus numbers", url: "https://pressbooks.ulib.csuohio.edu/republic/?p=37", extract: {stephanus: "514a-517a"}}
              - {kind: book, title: "Republic, Grube/Reeve (Hackett), if you have it", locator: "Book VII, 514a–517a"}
          - id: p0-w1-l5
            kind: read
            original_date: 2026-11-12
            title: "Plato, Republic 517b–521b: Socrates explains the Cave"
            task: >
              Republic 517b–521b, where Socrates explains the image and why the philosopher must
              go back down. Apply Weston's rules as you read: mark each premise and each
              inference.
            note_prompt: "Pick the one thesis the passage argues for most directly."
            sources:
              - {kind: free-online, title: "Republic Book 7, modernized Jowett", url: "https://pressbooks.ulib.csuohio.edu/republic/?p=37", extract: {stephanus: "517b-521b"}}
              - {kind: book, title: "Republic, Grube/Reeve (Hackett), if you have it", locator: "Book VII, 517b–521b"}
          - id: p0-w1-l6
            kind: write
            original_date: 2026-11-13
            title: "Reconstruction 1: The Cave as an argument"
            requires: [p0-w1-l4, p0-w1-l5]
            task: >
              Reconstruction 1 (400–600 words, saved under reconstructions/philosophy/unit-p0-w1/):
              The Cave as an argument. Thesis in one sentence; numbered premises; the inference
              steps; the strongest objection you can find; whether it lands. Don't polish. This
              is the thing you bring to seminar.
            note_prompt: "What was hardest to pin down: the thesis, the premises, or the inference?"
            sources: []
          - id: p0-w1-s1
            kind: seminar
            original_date: 2026-11-15
            title: "Seminar 1: the Cave"
            requires: [p0-w1-l6]
            task: >
              Bring Reconstruction 1. Claude argues that the Cave isn't an argument at all but an
              image, and that your premises are smuggled in from elsewhere in the Republic; you
              defend or concede, step by step. End by noting two things to change.
            sources: []

      # ── Week 2 ────────────────────────────────────────────────────────────
      - id: p0-w2
        title: "Week 2: argument forms and the first seminar"
        goal: >
          You know the half-dozen valid deductive forms by name and can spot which one a passage
          is using. Second reconstruction, this time on a text you haven't read before.
        audio:
          - {title: "Peter Adamson, History of Philosophy Without Any Gaps, episodes 1–6 (Thales to Heraclitus)", url: "https://historyofphilosophy.net", note: "Twenty minutes each; denser than Philosophize This! and the one you'll keep for the next year."}
        lessons:
          - id: p0-w2-l1
            kind: read
            original_date: 2026-11-16
            title: "Weston, Arguments about Causes and Deductive Arguments"
            task: >
              Weston, "Arguments about Causes" and "Deductive Arguments" (modus ponens, modus
              tollens, hypothetical syllogism, disjunctive syllogism, dilemma, reductio ad
              absurdum). Write one example of each form yourself, in plain English.
            note_prompt: "Which form was the Cave reconstruction using, if any?"
            sources:
              - {kind: book, title: "Weston, A Rulebook for Arguments", locator: "chapters 'Arguments about Causes' and 'Deductive Arguments'"}
              - {kind: free-online, title: "Van Cleave, Introduction to Logic and Critical Thinking (open textbook)", url: "https://open.umn.edu/opentextbooks/textbooks/457", extract: {chapter: "2"}, verified: false, note: "Stand-in if you don't have Weston: ch. 2 (formal methods: the valid deductive forms). Link unverified until the stage 2 availability check runs."}
          - id: p0-w2-l2
            kind: read
            original_date: 2026-11-17
            title: "Weston, Extended Arguments and fallacies; revise Reconstruction 1"
            task: >
              Weston, "Extended Arguments" and the appendix on fallacies. Then revise
              Reconstruction 1 using the seminar's two notes: a 20-minute edit, not a rewrite.
              Save as v2.
            note_prompt: "Which of the two seminar notes changed the argument, and which only the wording?"
            sources:
              - {kind: book, title: "Weston, A Rulebook for Arguments", locator: "chapter 'Extended Arguments'; appendix on fallacies"}
              - {kind: free-online, title: "Van Cleave, Introduction to Logic and Critical Thinking (open textbook)", url: "https://open.umn.edu/opentextbooks/textbooks/457", extract: {chapter: "4"}, verified: false, note: "Stand-in if you don't have Weston: ch. 4 (informal fallacies). Link unverified until the stage 2 availability check runs."}
          - id: p0-w2-l3
            kind: read
            original_date: 2026-11-18
            title: "Pryor, Guidelines on Writing a Philosophy Paper"
            task: "Read all of it. It's long, so this is the whole 40 minutes."
            note_prompt: "The three rules your reconstruction broke."
            sources:
              - {kind: free-online, title: "Guidelines on Writing a Philosophy Paper", url: "http://www.jimpryor.net/teaching/guidelines/writing.html", extract: all}
          - id: p0-w2-l4
            kind: read
            original_date: 2026-11-19
            title: "Descartes, Second Meditation: the cogito"
            task: >
              Descartes, Meditations, Second Meditation, first five paragraphs only: the cogito
              passage (about two pages). Read three times. Mark the inferences.
            note_prompt: "What exactly is being concluded, and from what?"
            sources:
              - {kind: free-online, title: "Descartes, Meditations (Early Modern Texts PDF)", url: "https://www.earlymoderntexts.com/assets/pdfs/descartes1641.pdf", extract: {section: "Second Meditation", paragraphs: "1-5"}}
          - id: p0-w2-l5
            kind: write
            original_date: 2026-11-20
            title: "Reconstruction 2: the cogito"
            requires: [p0-w2-l4]
            task: >
              Reconstruction 2 (400–600 words): the cogito. Same shape as before. The hard part:
              is it an inference at all, or something else? Say which and defend it.
            note_prompt: "Inference or not: which did you argue, and what's the best case for the other side?"
            sources: []
          - id: p0-w2-s1
            kind: seminar
            original_date: 2026-11-22
            title: "Seminar 2: the cogito"
            requires: [p0-w2-l5]
            task: >
              Bring Reconstruction 2. Claude presses on whether "I think" already assumes an "I,"
              and on whether Descartes is inferring or just noticing. Note two things to change.
            sources: []

      # ── Week 3 ────────────────────────────────────────────────────────────
      - id: p0-w3
        title: "Week 3: logic begins"
        goal: >
          Validity, soundness and the counterexample method are second nature. Do the exercises
          on paper; logic learned by reading alone doesn't stick.
        have_ready:
          - {kind: free-online, title: "Peter Smith, An Introduction to Formal Logic, 2nd ed. (free PDF and exercise answers at Logic Matters)", url: "https://www.logicmatters.net/ifl/", note: "Chapter numbers are for the 2nd edition; if yours differ, go by the topics."}
        audio:
          - {title: "Adamson, episodes 7–14 (Parmenides, Zeno, the atomists, the Sophists)", url: "https://historyofphilosophy.net", note: "Parmenides is the first real metaphysician; notice how much of the later tradition is a reaction to him."}
        lessons:
          - id: p0-w3-l1
            kind: exercise
            original_date: 2026-11-23
            title: "Smith ch. 1–2: what deductive logic is; validity and soundness"
            task: "Smith ch. 1–2. Exercises for ch. 2, on paper."
            note_prompt: "A valid argument with a false conclusion: write one."
            sources:
              - {kind: free-online, title: "Smith, An Introduction to Formal Logic (PDF)", url: "https://www.logicmatters.net/ifl/", extract: {chapters: "1-2"}}
          - id: p0-w3-l2
            kind: exercise
            original_date: 2026-11-24
            title: "Smith ch. 3–4: forms of inference; what a proof is"
            task: "Smith ch. 3–4. Exercises."
            note_prompt: "Connect two of Weston's forms to Smith's treatment."
            sources:
              - {kind: free-online, title: "Smith, An Introduction to Formal Logic (PDF)", url: "https://www.logicmatters.net/ifl/", extract: {chapters: "3-4"}}
          - id: p0-w3-l3
            kind: exercise
            original_date: 2026-11-25
            title: "Smith ch. 5: the counterexample method"
            task: "Smith ch. 5. Exercises. These matter most."
            note_prompt: "Build a counterexample to \"affirming the consequent\" using a premise from the Cave."
            sources:
              - {kind: free-online, title: "Smith, An Introduction to Formal Logic (PDF)", url: "https://www.logicmatters.net/ifl/", extract: {chapters: "5"}}
          - id: p0-w3-l4
            kind: write
            original_date: 2026-11-27
            title: "Light write: validity and soundness for a friend"
            requires: [p0-w3-l1, p0-w3-l3]
            task: >
              Half a page: explain validity and soundness to a friend who has never studied
              logic, using the cogito as your example.
            note_prompt: "Which of the two was harder to explain without jargon?"
            sources: []
          - id: p0-w3-s1
            kind: seminar
            original_date: 2026-11-29
            title: "Seminar 3: the exercises you got wrong"
            requires: [p0-w3-l3]
            task: >
              Different format: bring the three exercises you got wrong or doubted most, and work
              through them with Claude. Then Claude gives you a short argument cold and you assess
              it live, talking it through.
            sources: []

      # ── Week 4 ────────────────────────────────────────────────────────────
      - id: p0-w4
        title: "Week 4: propositional logic and the exit test"
        goal: >
          You can translate simple English arguments into propositional logic and test them for
          validity with a truth table. The write is a preview of the Phase 0 exit test on Hume.
        audio:
          - {title: "Adamson, episodes 15–20 (Socrates and the beginnings of Plato)", url: "https://historyofphilosophy.net", note: "This is the lecture prep for Unit 1."}
        lessons:
          - id: p0-w4-l1
            kind: exercise
            original_date: 2026-11-30
            title: "Smith ch. 6–8: propositions, connectives, a formal language"
            task: >
              Smith ch. 6–8: propositions and their forms; the connectives (and, or, not); the
              idea of a formal language. Translate five English sentences of your own into the symbols.
            note_prompt: "Which of your five sentences resisted translation, and why?"
            sources:
              - {kind: free-online, title: "Smith, An Introduction to Formal Logic (PDF)", url: "https://www.logicmatters.net/ifl/", extract: {chapters: "6-8"}}
          - id: p0-w4-l2
            kind: exercise
            original_date: 2026-12-01
            title: "Smith ch. 9–10: syntax, semantics, truth tables for the connectives"
            task: "Smith ch. 9–10. Exercises."
            note_prompt: "Where does ordinary English \"if\" differ from the arrow?"
            sources:
              - {kind: free-online, title: "Smith, An Introduction to Formal Logic (PDF)", url: "https://www.logicmatters.net/ifl/", extract: {chapters: "9-10"}}
          - id: p0-w4-l3
            kind: exercise
            original_date: 2026-12-02
            title: "Smith ch. 11–13: truth-table tests for validity"
            task: "Smith ch. 11–13: truth-table tests for validity; tautologies and contradictions. Five exercises, full tables, on paper."
            note_prompt: "Which exercise took longest, and what slowed it?"
            sources:
              - {kind: free-online, title: "Smith, An Introduction to Formal Logic (PDF)", url: "https://www.logicmatters.net/ifl/", extract: {chapters: "11-13"}}
          - id: p0-w4-l4
            kind: exercise
            original_date: 2026-12-03
            title: "Smith ch. 14–15: tautological entailment and equivalence"
            task: "Smith ch. 14–15. Five exercises."
            note_prompt: "Take the cogito or Cave reconstruction and write its form in symbols. Is it valid by truth table?"
            sources:
              - {kind: free-online, title: "Smith, An Introduction to Formal Logic (PDF)", url: "https://www.logicmatters.net/ifl/", extract: {chapters: "14-15"}}
          - id: p0-w4-l5
            kind: write
            original_date: 2026-12-04
            title: "Reconstruction 3: Hume's fork (exit-test preview)"
            requires: [p0-w4-l3, p0-w4-l4]
            task: >
              Hume, Enquiry Concerning Human Understanding, Section IV Part I (about five pages).
              Reconstruction 3 (400–600 words): the argument that all reasoning concerns either
              relations of ideas or matters of fact, and that causal knowledge belongs to the
              second. Number the premises; state the form; say whether it's valid, and whether
              the premises are true.
            note_prompt: "Valid? Sound? Which premise would Hume's opponent attack first?"
            sources:
              - {kind: free-online, title: "Hume, Enquiry (Early Modern Texts PDF)", url: "https://www.earlymoderntexts.com/assets/pdfs/hume1748.pdf", extract: {section: "Section 4, Part 1"}}
          - id: p0-w4-s1
            kind: seminar
            original_date: 2026-12-06
            title: "Seminar 4: Hume's fork"
            requires: [p0-w4-l5]
            task: >
              Bring Reconstruction 3. Claude argues that the fork is itself neither a relation of
              ideas nor a matter of fact, so it cuts its own branch. Defend or concede. Then the
              Phase 0 exit check: Claude hands you a fresh Hume paragraph; number its premises,
              state the conclusion, say whether the form is valid.
            sources: []

      # ── Weeks 5–6: to be drafted day by day with you, roughly two weeks before you reach them.
      - id: p0-w5-6
        title: "Weeks 5–6: the map"
        status: undrafted
        goal: "A one-page timeline in your own words: who answered whom, and about what."
        read: "Anthony Kenny, A New History of Western Philosophy: the introductions and the chapter openings of all four parts, not the detail yet. Keep it as the companion for all of Phase 1."
        listen: "Michael Sugrue's Great Minds of the Western Tradition lectures: Plato, Aristotle, Descartes, Kant (4 h total) — https://www.youtube.com/@dr.michaelsugrue"
        write: "A one-page timeline: who answered whom, and about what."
        exit_test: "Take a paragraph from Hume, number its premises, state its conclusion, say whether the form is valid. If not, spend two more weeks on logic."
        lessons: []

  # ───────────────────────────────────────────────────────────────────────────
  - id: phase-1
    title: The Western spine
    summary: >
      Twenty-five units in chronological order, each three to four weeks. Every unit has a
      primary text, a guide, a lecture, and a writing task. M = metaphysics track, S = social
      theory track. Standing companions: Kenny's New History before each thinker, the Stanford
      Encyclopedia of Philosophy entry afterwards, Adamson's podcast for Units 1–7. Pace check:
      if a unit regularly spills past four weeks, cut the primary reading, never the writing.
    units:
      - {id: p1-u01, status: undrafted, title: "Socrates and method", tags: [], primary: "Plato, Euthyphro, Apology, Meno", guide: "Kenny ch. on Plato; SEP \"Plato\"", lecture: "Sugrue, Plato; Adamson eps. on Socrates", writing: "Reconstruct the Euthyphro dilemma", lessons: []}
      - {id: p1-u02, status: undrafted, title: "Plato's Forms", tags: [M], primary: "Phaedo; Republic books V–VII", guide: "Julia Annas, Plato: A Very Short Introduction", lecture: "Adamson, Plato series", writing: "The argument from recollection; does the Third Man objection work?", lessons: []}
      - {id: p1-u03, status: undrafted, title: "Plato on the city", tags: [S], primary: "Republic books I–IV, VIII–IX", guide: "Annas, Introduction to Plato's Republic (selections)", lecture: "Steven B. Smith, Yale Intro to Political Philosophy, lectures 1–6", writing: "Essay 1: Is Thrasymachus refuted?", lessons: []}
      - {id: p1-u04, status: undrafted, title: "Aristotle's method and metaphysics", tags: [M], primary: "Categories 1–5; Physics II; Metaphysics I, IV, VII (selections)", guide: "Jonathan Barnes, Aristotle: A VSI; Christopher Shields, Aristotle (Routledge)", lecture: "Sugrue, Aristotle; Adamson Aristotle eps.", writing: "Reconstruct the four causes and the principle of non-contradiction defence", lessons: []}
      - {id: p1-u05, status: undrafted, title: "Aristotle on the good life", tags: [S], primary: "Nicomachean Ethics I–III, X; Politics I, III", guide: "Shields, Aristotle ch. on ethics", lecture: "Smith, Yale lectures 7–9", writing: "The function argument, premise by premise", lessons: []}
      - {id: p1-u06, status: undrafted, title: "Hellenistic schools", tags: [], primary: "Epictetus, Handbook; Epicurus, Letter to Menoeceus; Sextus Empiricus, Outlines I (selections)", guide: "Kenny; A. A. Long, Hellenistic Philosophy (selections)", lecture: "Adamson Hellenistic eps.", writing: "Compare Stoic and Epicurean views of what we control", lessons: []}
      - {id: p1-u07a, status: undrafted, title: "Augustine, Anselm, universals", tags: [M], primary: "Augustine, Confessions XI (on time); Anselm, Proslogion 2–4 with Gaunilo's reply; Porphyry, Isagoge (opening); Abelard on universals via Kenny", guide: "Kenny vol. 2; SEP \"Ontological Arguments\", \"The Medieval Problem of Universals\"", lecture: "Adamson medieval episodes; Gregory Sadler on Anselm", writing: "Reconstruct the ontological argument; the realism/nominalism dispute in one page", lessons: []}
      - {id: p1-u07b, status: undrafted, title: "Aquinas", tags: [M, S], primary: "De Ente et Essentia (whole); Summa Theologiae Ia Q2 (Five Ways), Q3, Q13, Q75–76, Q84–86; Ia-IIae Q90–97 (Treatise on Law)", guide: "Brian Davies, The Thought of Thomas Aquinas; Edward Feser, Aquinas: A Beginner's Guide; SEP \"Thomas Aquinas\"", lecture: "Adamson's Aquinas episodes; Thomistic Institute, Aquinas 101", writing: "Reconstruct the First Way and the essence/existence distinction; one page on natural law as the bridge from metaphysics to the social thread", lessons: []}
      - {id: p1-u08, status: undrafted, title: "Descartes", tags: [M], primary: "Meditations (all), with Objections and Replies II and IV", guide: "Gary Hatfield, Descartes and the Meditations (Routledge)", lecture: "Sugrue, Descartes; Adamson (if released)", writing: "The cogito, the wax, the real-distinction argument", lessons: []}
      - {id: p1-u09, status: undrafted, title: "Hobbes", tags: [S], primary: "Leviathan I–II (chs. 13–21 closely)", guide: "Richard Tuck, Hobbes: A VSI", lecture: "Smith, Yale lectures 12–14", writing: "Essay 2: Plato vs Hobbes on why we need a state", lessons: []}
      - {id: p1-u10, status: undrafted, title: "Spinoza", tags: [M], primary: "Ethics Part I (all), Part II props 1–13", guide: "Steven Nadler, Spinoza's Ethics: An Introduction", lecture: "Nadler lectures (YouTube)", writing: "Substance monism: reconstruct the argument to IP14", lessons: []}
      - {id: p1-u11, status: undrafted, title: "Locke", tags: [M, S], primary: "Essay II.xxvii (personal identity), II.viii (qualities); Second Treatise chs. 2–5, 8–9", guide: "E. J. Lowe, Locke on Human Understanding; Smith lectures 15–16", lecture: "Smith, Yale", writing: "Locke's memory theory and Reid's brave-officer objection; property in the Second Treatise", lessons: []}
      - {id: p1-u12, status: undrafted, title: "Leibniz and Berkeley", tags: [M], primary: "Leibniz, Monadology, Discourse on Metaphysics; Berkeley, Three Dialogues", guide: "Kenny; SEP entries", lecture: "Adamson or Sugrue", writing: "Why Berkeley thinks matter is incoherent; Leibniz on identity of indiscernibles", lessons: []}
      - {id: p1-u13, status: undrafted, title: "Hume", tags: [M], primary: "Enquiry Concerning Human Understanding (all); Treatise I.iv.6 (personal identity)", guide: "Peter Millican's Oxford Hume lectures (free podcast); Don Garrett, Hume (Routledge)", lecture: "Millican", writing: "Induction and causation: the fork, the argument, the sceptical solution", lessons: []}
