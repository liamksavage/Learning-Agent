milestones:
  - {when: "End of Phase 0", milestone: "Can read an argument", test: "Take any paragraph from Hume, number its premises, say whether the inference is valid."}
  - {when: "After Unit 7", milestone: "Ancient and medieval base", test: "Explain, without notes, how Aristotle's substances answer Plato's Forms, and why Aquinas needed both."}
  - {when: "After Unit 14", milestone: "Early modern base", test: "State the rationalist/empiricist dispute as a disagreement about a specific question; explain what Hobbes, Locke and Rousseau each think legitimacy requires."}
  - {when: "After Unit 16", milestone: "Kant", test: "Explain in two pages how the first Critique answers Hume, and what it gives up to do so."}
  - {when: "End of Phase 1", milestone: "Intermediate", test: "Read a new philosophy paper, identify its tradition and problem, reconstruct its main argument in an hour."}
  - {when: "One year into Phase 2", milestone: "Advanced amateur", test: "Read a current journal article, find the weak premise, know who has already attacked it."}
  - {when: "Ongoing", milestone: "The real test", test: "You change your mind about something you believed, because of an argument, roughly once a year."}
